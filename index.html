<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Spin & Win!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --orange: #FF6B35;
    --pink: #FF3CAC;
    --purple: #7B2FBE;
    --dark: #0D0D1A;
    --glow: 0 0 30px rgba(255,215,0,0.5);
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–dark);
font-family: ‘Nunito’, sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
position: relative;
}

/* Stars background */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
radial-gradient(circle at 20% 20%, rgba(123,47,190,0.3) 0%, transparent 50%),
radial-gradient(circle at 80% 80%, rgba(255,60,172,0.2) 0%, transparent 50%),
radial-gradient(circle at 50% 50%, rgba(255,107,53,0.1) 0%, transparent 70%);
pointer-events: none;
}

.stars {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
}

.star {
position: absolute;
background: white;
border-radius: 50%;
animation: twinkle var(–d) ease-in-out infinite;
}

@keyframes twinkle {
0%, 100% { opacity: 0.2; transform: scale(1); }
50% { opacity: 1; transform: scale(1.5); }
}

.container {
position: relative;
z-index: 10;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
padding: 20px;
}

.title {
font-family: ‘Fredoka One’, cursive;
font-size: clamp(2rem, 8vw, 3.5rem);
background: linear-gradient(135deg, var(–gold), var(–orange), var(–pink));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-align: center;
text-shadow: none;
filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
animation: pulse-title 3s ease-in-out infinite;
}

@keyframes pulse-title {
0%, 100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.4)); }
50% { filter: drop-shadow(0 0 40px rgba(255,107,53,0.8)); }
}

.subtitle {
color: rgba(255,255,255,0.6);
font-size: 1rem;
font-weight: 700;
letter-spacing: 2px;
text-transform: uppercase;
margin-top: -15px;
}

.wheel-wrap {
position: relative;
width: min(380px, 90vw);
height: min(380px, 90vw);
}

/* Glow ring */
.wheel-wrap::before {
content: ‘’;
position: absolute;
inset: -8px;
border-radius: 50%;
background: conic-gradient(var(–gold), var(–orange), var(–pink), var(–purple), var(–gold));
animation: spin-ring 4s linear infinite;
z-index: 0;
}

.wheel-wrap::after {
content: ‘’;
position: absolute;
inset: -3px;
border-radius: 50%;
background: var(–dark);
z-index: 1;
}

@keyframes spin-ring {
to { transform: rotate(360deg); }
}

canvas#wheel {
position: relative;
z-index: 2;
border-radius: 50%;
display: block;
width: 100%;
height: 100%;
}

/* Pointer */
.pointer {
position: absolute;
top: -18px;
left: 50%;
transform: translateX(-50%);
z-index: 10;
width: 0;
height: 0;
border-left: 16px solid transparent;
border-right: 16px solid transparent;
border-top: 40px solid var(–gold);
filter: drop-shadow(0 4px 10px rgba(255,215,0,0.8));
animation: bounce-pointer 1.5s ease-in-out infinite;
}

@keyframes bounce-pointer {
0%, 100% { transform: translateX(-50%) translateY(0); }
50% { transform: translateX(-50%) translateY(-5px); }
}

/* Center hub */
.hub {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 10;
width: 52px;
height: 52px;
background: radial-gradient(circle, #fff 0%, var(–gold) 100%);
border-radius: 50%;
box-shadow: 0 0 20px rgba(255,215,0,0.8), inset 0 2px 4px rgba(255,255,255,0.8);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.4rem;
}

.spin-btn {
font-family: ‘Fredoka One’, cursive;
font-size: clamp(1.2rem, 5vw, 1.6rem);
padding: 16px 60px;
background: linear-gradient(135deg, var(–gold), var(–orange));
color: var(–dark);
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 8px 30px rgba(255,107,53,0.5), 0 0 0 3px rgba(255,215,0,0.3);
transition: all 0.2s ease;
text-transform: uppercase;
letter-spacing: 2px;
position: relative;
overflow: hidden;
}

.spin-btn::before {
content: ‘’;
position: absolute;
top: 0; left: -100%;
width: 100%; height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
transition: left 0.4s ease;
}

.spin-btn:hover::before { left: 100%; }
.spin-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,107,53,0.7), 0 0 0 4px rgba(255,215,0,0.5); }
.spin-btn:active { transform: translateY(0); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.spin-count {
color: rgba(255,255,255,0.5);
font-size: 0.85rem;
text-align: center;
}

.spin-count span {
color: var(–gold);
font-weight: 900;
}

/* Modal */
.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.85);
z-index: 1000;
align-items: center;
justify-content: center;
backdrop-filter: blur(6px);
}

.modal-overlay.show { display: flex; }

.modal {
background: linear-gradient(135deg, #1a0a2e, #0d0d1a);
border: 2px solid rgba(255,215,0,0.4);
border-radius: 24px;
padding: 40px 32px;
text-align: center;
max-width: 360px;
width: 90%;
box-shadow: 0 0 60px rgba(255,215,0,0.3), 0 20px 60px rgba(0,0,0,0.5);
animation: pop-in 0.5s cubic-bezier(0.34,1.56,0.64,1);
position: relative;
overflow: hidden;
}

.modal::before {
content: ‘’;
position: absolute;
inset: 0;
background: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.1), transparent 70%);
pointer-events: none;
}

@keyframes pop-in {
from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
to { transform: scale(1) rotate(0deg); opacity: 1; }
}

.modal-emoji { font-size: 5rem; display: block; margin-bottom: 10px; animation: bounce-emoji 0.5s ease 0.3s both; }

@keyframes bounce-emoji {
0% { transform: scale(0); }
60% { transform: scale(1.3); }
100% { transform: scale(1); }
}

.modal-title {
font-family: ‘Fredoka One’, cursive;
font-size: 2.2rem;
color: var(–gold);
margin-bottom: 8px;
}

.modal-prize {
font-size: 1.4rem;
font-weight: 900;
color: white;
margin-bottom: 20px;
padding: 12px 20px;
background: rgba(255,215,0,0.15);
border-radius: 12px;
border: 1px solid rgba(255,215,0,0.3);
}

.win-code-wrap {
margin-bottom: 20px;
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
}

.win-code-label {
color: rgba(255,255,255,0.6);
font-size: 0.85rem;
font-weight: 700;
}

.win-code-box {
font-family: ‘Courier New’, monospace;
font-size: 1.3rem;
font-weight: 900;
color: var(–gold);
background: rgba(255,215,0,0.1);
border: 2px dashed rgba(255,215,0,0.5);
border-radius: 12px;
padding: 12px 24px;
letter-spacing: 3px;
user-select: all;
}

.copy-btn {
font-family: ‘Nunito’, sans-serif;
font-size: 0.85rem;
font-weight: 700;
padding: 7px 20px;
background: rgba(255,255,255,0.1);
color: white;
border: 1px solid rgba(255,255,255,0.2);
border-radius: 20px;
cursor: pointer;
transition: all 0.2s;
}

.copy-btn:hover { background: rgba(255,255,255,0.2); }
.copy-btn.copied { background: rgba(0,200,100,0.3); border-color: #00C864; color: #00C864; }

.modal-msg {
color: rgba(255,255,255,0.6);
font-size: 0.95rem;
margin-bottom: 12px;
}

.modal-btn {
font-family: ‘Fredoka One’, cursive;
font-size: 1.1rem;
padding: 12px 40px;
background: linear-gradient(135deg, var(–pink), var(–purple));
color: white;
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 4px 20px rgba(255,60,172,0.5);
transition: all 0.2s;
letter-spacing: 1px;
}

.modal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,60,172,0.7); }

/* Confetti */
.confetti-piece {
position: fixed;
width: 10px;
height: 14px;
top: -20px;
opacity: 0;
border-radius: 2px;
animation: confetti-fall var(–dur) ease-in var(–delay) forwards;
z-index: 2000;
pointer-events: none;
}

@keyframes confetti-fall {
0% { transform: translateX(0) rotateZ(0deg) rotateX(0deg); opacity: 1; top: -20px; }
100% { transform: translateX(var(–drift)) rotateZ(var(–spin)) rotateX(720deg); opacity: 0; top: 110vh; }
}

/* Result history */
.history {
display: flex;
gap: 8px;
flex-wrap: wrap;
justify-content: center;
max-width: 380px;
}

.history-item {
background: rgba(255,255,255,0.07);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 20px;
padding: 4px 12px;
font-size: 0.8rem;
color: rgba(255,255,255,0.7);
animation: fade-in 0.3s ease;
}

@keyframes fade-in {
from { opacity: 0; transform: scale(0.8); }
to { opacity: 1; transform: scale(1); }
}

.footer {
color: rgba(255,255,255,0.2);
font-size: 0.75rem;
margin-top: 10px;
}
</style>

</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <div class="title">🎰 SPIN & WIN</div>
  <div class="subtitle">Try your luck today!</div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="380" height="380"></canvas>
    <div class="hub">✨</div>
  </div>

<button class="spin-btn" id="spinBtn" onclick="spin()">🎯 SPIN!</button>

  <div class="spin-count">You have <span id="spinsLeft">3</span> free spins today</div>
  <div class="history" id="history"></div>
  <div class="footer">Share with your friends 🔗</div>
</div>

<!-- Win Modal -->

<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="modal-emoji" id="modalEmoji">🎉</span>
    <div class="modal-title" id="modalTitle">YOU WIN!</div>
    <div class="modal-prize" id="modalPrize">Amazing Prize!</div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="win-code-wrap" id="winCodeWrap">
      <div class="win-code-label">📩 Send this code to our DM to claim:</div>
      <div class="win-code-box" id="winCode">WIN-XXXX-XXXX-0000</div>
      <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
    </div>
    <button class="modal-btn" onclick="closeModal()">🎊 Claim Now!</button>
  </div>
</div>

<script>
// ===== CUSTOMIZE YOUR PRIZES HERE =====
const segments = [
  { label: "$10K + MacBook Pro 💻", color: "#0077B6", emoji: "💻", code: "WIN-10K-MBP-4471", msg: "🎉 You won $10,000 CASH + MacBook Pro + USA Political Party Cap!" },
  { label: "Try Again 😅",          color: "#2D0057", emoji: "😅", code: null,              msg: "Aww! Not this time — spin again and try your luck! 💪" },
  { label: "$15K + MacBook Pro 👑", color: "#B8860B", emoji: "👑", code: "WIN-15K-MBP-8823", msg: "🏆 MEGA WIN! $15,000 CASH + MacBook Pro + USA Political Party Cap is YOURS!" },
  { label: "iPhone 16 Pro Max 📱",  color: "#1a1a2e", emoji: "📱", code: "WIN-IP16-PRO-3356", msg: "📱 You just won a Brand New iPhone 16 Pro Max!" },
  { label: "$5K + MacBook Pro 🎯",  color: "#7B2FBE", emoji: "🎯", code: "WIN-5K-MBP-6612",  msg: "🎯 Amazing! $5,000 CASH + MacBook Pro + USA Political Party Cap is yours!" },
  { label: "Try Again 😅",          color: "#1a0a2e", emoji: "😅", code: null,              msg: "So close! Give it another spin — big prizes are waiting! 🤞" },
  { label: "$20,000 CASH 💰",       color: "#8B0000", emoji: "💰", code: "WIN-20K-CSH-9901", msg: "💰 JACKPOT! You just won $20,000 CASH! You're a WINNER! 🔥🔥🔥" },
  { label: "PS5 + Games 🎮",        color: "#003366", emoji: "🎮", code: "WIN-PS5-GAM-7743",  msg: "🎮 You won a PlayStation 5 Console + 5 Games Bundle!" },
  { label: "$5K + MacBook Pro 🎯",  color: "#FF3CAC", emoji: "🎯", code: "WIN-5K-MBP-2287",  msg: "🎯 You won $5,000 CASH + MacBook Pro + USA Political Party Cap!" },
  { label: "Try Again 😅",          color: "#2D0057", emoji: "😅", code: null,              msg: "Not this time! Keep spinning — a huge prize is on its way! 🤞" },
  { label: "$10K + MacBook Pro 💻", color: "#006400", emoji: "💻", code: "WIN-10K-MBP-5538", msg: "🎉 $10,000 CASH + MacBook Pro + USA Political Party Cap is YOURS!" },
  { label: "Luxury Watch ⌚",       color: "#4A0000", emoji: "⌚", code: "WIN-LUX-WCH-1129", msg: "⌚ You just won a Premium Luxury Watch worth $3,000!" },
];
// ======================================

const MAX_SPINS = 3;
const STORAGE_KEY = 'spinwin_data';

let currentAngle = 0;
let spinning = false;
let spinsLeft = MAX_SPINS;
let history = [];

// Load saved state
function loadState() {
  try {
    const today = new Date().toDateString();
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.date === today) {
      spinsLeft = saved.spinsLeft ?? MAX_SPINS;
      history = saved.history ?? [];
    } else {
      spinsLeft = MAX_SPINS;
      history = [];
    }
  } catch(e) { spinsLeft = MAX_SPINS; history = []; }
  updateUI();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: new Date().toDateString(),
      spinsLeft, history
    }));
  } catch(e) {}
}

// Draw wheel
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = segments.length;
const ARC = (2 * Math.PI) / N;

function drawWheel(rotation = 0) {
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 10;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const start = rotation + i * ARC - Math.PI / 2;
    const end = start + ARC;

    // Segment
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = segments[i].color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + ARC / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `bold ${canvas.width > 300 ? 13 : 11}px Nunito, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 4;
    const text = segments[i].label.length > 14 ? segments[i].label.slice(0, 13) + '…' : segments[i].label;
    ctx.fillText(text, r - 14, 5);
    ctx.restore();
  }

  // Center shadow
  ctx.beginPath();
  ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
}

function spin() {
  if (spinning || spinsLeft <= 0) return;

  spinning = true;
  spinsLeft--;
  document.getElementById('spinBtn').disabled = true;

  const extraSpins = 5 + Math.floor(Math.random() * 5);
  const targetAngle = Math.random() * 2 * Math.PI;
  const totalRotation = extraSpins * 2 * Math.PI + targetAngle;
  const duration = 4000 + Math.random() * 1000;
  const start = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOut(progress);

    currentAngle = startAngle + totalRotation * eased;
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = currentAngle % (2 * Math.PI);
      spinning = false;

      // Determine winner — pointer is at top (12 o'clock)
      const normalized = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
      const index = Math.floor(normalized / ARC) % N;
      const winner = segments[index];

      history.unshift(winner.emoji + ' ' + winner.label.split(' ')[0]);
      if (history.length > 5) history.pop();

      saveState();
      updateUI();

      setTimeout(() => showModal(winner), 300);
    }
  }

  requestAnimationFrame(animate);
}

function showModal(winner) {
  document.getElementById('modalEmoji').textContent = winner.emoji;
  const isTryAgain = !winner.code;
  document.getElementById('modalTitle').textContent = isTryAgain ? 'SPIN AGAIN!' : '🎉 YOU WIN!';
  document.getElementById('modalPrize').textContent = winner.label;
  document.getElementById('modalMsg').textContent = winner.msg;

  const codeWrap = document.getElementById('winCodeWrap');
  if (winner.code) {
    document.getElementById('winCode').textContent = winner.code;
    codeWrap.style.display = 'flex';
  } else {
    codeWrap.style.display = 'none';
  }

  document.getElementById('modal').classList.add('show');
  if (!isTryAgain) launchConfetti();
}

function copyCode() {
  const code = document.getElementById('winCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy Code'; btn.classList.remove('copied'); }, 2000);
  });
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('spinBtn').disabled = spinsLeft <= 0;
}

function updateUI() {
  document.getElementById('spinsLeft').textContent = spinsLeft;
  document.getElementById('spinBtn').disabled = spinsLeft <= 0 || spinning;
  if (spinsLeft <= 0) {
    document.getElementById('spinBtn').textContent = '⏰ Come Back Tomorrow!';
  }

  const histEl = document.getElementById('history');
  histEl.innerHTML = history.map(h => `<div class="history-item">${h}</div>`).join('');
}

function launchConfetti() {
  const colors = ['#FFD700','#FF6B35','#FF3CAC','#7B2FBE','#00CFFF','#ADFF2F'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const hue = colors[Math.floor(Math.random() * colors.length)];
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      background: ${hue};
      --dur: ${1.5 + Math.random() * 2}s;
      --delay: ${Math.random() * 0.5}s;
      --drift: ${(Math.random() - 0.5) * 200}px;
      --spin: ${(Math.random() - 0.5) * 720}deg;
      width: ${6 + Math.random() * 10}px;
      height: ${8 + Math.random() * 14}px;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// Stars
function initStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width: ${size}px; height: ${size}px;
      top: ${Math.random() * 100}vh;
      left: ${Math.random() * 100}vw;
      --d: ${2 + Math.random() * 4}s;
      animation-delay: ${Math.random() * 4}s;
    `;
    c.appendChild(s);
  }
}

// Resize canvas for mobile
function resizeCanvas() {
  const size = Math.min(380, window.innerWidth * 0.88);
  canvas.width = size;
  canvas.height = size;
  drawWheel(currentAngle);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
initStars();
loadState();
</script>

</body>
</html>
