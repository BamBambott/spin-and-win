<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Spin & Win!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { background:#0D0D1A; }

body {
background:#0D0D1A;
font-family:‘Nunito’,sans-serif;
min-height:100vh;
display:flex; flex-direction:column;
align-items:center; justify-content:center;
overflow-x:hidden;
position:relative;
}

body::before {
content:’’;
position:fixed; inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(123,47,190,0.35) 0%, transparent 50%),
radial-gradient(circle at 80% 80%, rgba(255,60,172,0.25) 0%, transparent 50%);
pointer-events:none;
}

.container {
position:relative; z-index:10;
display:flex; flex-direction:column;
align-items:center; gap:18px;
padding:28px 16px; width:100%;
}

.title {
font-family:‘Fredoka One’,cursive;
font-size:clamp(2rem,9vw,3.2rem);
background:linear-gradient(135deg,#FFD700,#FF6B35,#FF3CAC);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-align:center;
filter:drop-shadow(0 0 18px rgba(255,215,0,0.5));
}

.subtitle {
color:rgba(255,255,255,0.55);
font-size:.9rem; font-weight:700;
letter-spacing:2px; text-transform:uppercase;
margin-top:-12px;
}

.wheel-wrap {
position:relative;
width:min(330px, 86vw);
height:min(330px, 86vw);
margin-top:28px;
}

.ring {
position:absolute; inset:-6px; border-radius:50%;
background:conic-gradient(#FFD700,#FF6B35,#FF3CAC,#7B2FBE,#00CFFF,#FFD700);
animation:spinring 3s linear infinite;
z-index:1;
}
.ring-inner {
position:absolute; inset:4px; border-radius:50%;
background:#0D0D1A; z-index:2;
}
@keyframes spinring { to{transform:rotate(360deg);} }

canvas {
position:absolute; inset:0;
width:100%; height:100%;
border-radius:50%; z-index:3;
}

/* BIG RED POINTER */
.pointer {
position:absolute;
top:-30px; left:50%;
transform:translateX(-50%);
z-index:20;
filter:drop-shadow(0 0 10px #FF0000) drop-shadow(0 2px 6px rgba(0,0,0,0.8));
}
.pointer svg {
width:36px; height:50px; display:block;
}

.hub {
position:absolute; top:50%; left:50%;
transform:translate(-50%,-50%);
z-index:20; width:46px; height:46px;
background:radial-gradient(circle,#fff 0%,#FFD700 100%);
border-radius:50%;
box-shadow:0 0 16px rgba(255,215,0,0.9), inset 0 2px 4px rgba(255,255,255,0.9);
display:flex; align-items:center; justify-content:center;
font-size:1.2rem;
}

.spin-btn {
font-family:‘Fredoka One’,cursive;
font-size:clamp(1.2rem,5vw,1.5rem);
padding:15px 52px;
background:linear-gradient(135deg,#FFD700,#FF6B35);
color:#0D0D1A; border:none; border-radius:50px;
cursor:pointer;
box-shadow:0 8px 28px rgba(255,107,53,0.55);
transition:all .2s;
text-transform:uppercase; letter-spacing:2px;
}
.spin-btn:hover:not(:disabled) {
transform:translateY(-3px);
box-shadow:0 12px 36px rgba(255,107,53,0.75);
}
.spin-btn:disabled { opacity:.4; cursor:not-allowed; }

.spin-count {
color:rgba(255,255,255,0.45);
font-size:.85rem; text-align:center;
}
.spin-count span { color:#FFD700; font-weight:900; }

.history {
display:flex; gap:7px; flex-wrap:wrap;
justify-content:center; max-width:330px;
}
.history-item {
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.12);
border-radius:20px; padding:4px 12px;
font-size:.78rem; color:rgba(255,255,255,0.65);
}

/* Modal */
.overlay {
display:none; position:fixed; inset:0;
background:rgba(0,0,0,0.88); z-index:1000;
align-items:center; justify-content:center;
backdrop-filter:blur(6px);
}
.overlay.show { display:flex; }

.modal {
background:linear-gradient(145deg,#1a0a2e,#0d0d1a);
border:2px solid rgba(255,215,0,0.4);
border-radius:24px; padding:34px 26px;
text-align:center; max-width:330px; width:92%;
box-shadow:0 0 50px rgba(255,215,0,0.25), 0 20px 60px rgba(0,0,0,0.6);
animation:popin .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popin {
from{transform:scale(.5) rotate(-8deg);opacity:0;}
to{transform:scale(1) rotate(0);opacity:1;}
}

.m-emoji { font-size:4rem; display:block; margin-bottom:8px; }
.m-title { font-family:‘Fredoka One’,cursive; font-size:1.9rem; color:#FFD700; margin-bottom:6px; }
.m-prize {
font-size:1.15rem; font-weight:900; color:#fff;
margin-bottom:12px; padding:10px 14px;
background:rgba(255,215,0,0.1);
border-radius:12px; border:1px solid rgba(255,215,0,0.3);
}
.m-msg { color:rgba(255,255,255,0.55); font-size:.88rem; margin-bottom:14px; }

.code-wrap {
display:none; flex-direction:column;
align-items:center; gap:9px; margin-bottom:18px;
}
.code-label { color:rgba(255,255,255,0.55); font-size:.8rem; font-weight:700; }
.code-box {
font-family:‘Courier New’,monospace;
font-size:1.2rem; font-weight:900; color:#FFD700;
background:rgba(255,215,0,0.1);
border:2px dashed rgba(255,215,0,0.5);
border-radius:12px; padding:10px 20px;
letter-spacing:3px; user-select:all;
}
.copy-btn {
font-size:.82rem; font-weight:700;
padding:6px 18px;
background:rgba(255,255,255,0.1);
color:#fff; border:1px solid rgba(255,255,255,0.2);
border-radius:20px; cursor:pointer; transition:all .2s;
}
.copy-btn:hover { background:rgba(255,255,255,0.2); }
.copy-btn.ok { background:rgba(0,200,100,0.3); border-color:#00C864; color:#00C864; }

.m-btn {
font-family:‘Fredoka One’,cursive;
font-size:1.1rem; padding:12px 36px;
background:linear-gradient(135deg,#FF3CAC,#7B2FBE);
color:#fff; border:none; border-radius:50px;
cursor:pointer; box-shadow:0 4px 18px rgba(255,60,172,0.5);
transition:all .2s; letter-spacing:1px;
}
.m-btn:hover { transform:translateY(-2px); box-shadow:0 8px 26px rgba(255,60,172,0.7); }

.confetti-piece {
position:fixed; top:-20px; opacity:0;
border-radius:2px; pointer-events:none; z-index:2000;
animation:cfall var(–d) ease-in var(–dl) forwards;
}
@keyframes cfall {
0%{transform:translateX(0) rotateZ(0);opacity:1;top:-20px;}
100%{transform:translateX(var(–x)) rotateZ(var(–r));opacity:0;top:110vh;}
}

.footer { color:rgba(255,255,255,0.18); font-size:.72rem; }
</style>

</head>

<button class="spin-btn" id="spinBtn" onclick="spin()">🎯 SPIN NOW!</button>

  <div class="spin-count">You have <span id="spinsLeft">1</span> free spin today</div>
  <div class="history" id="history"></div>

</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <span class="m-emoji" id="mEmoji">🎉</span>
    <div class="m-title" id="mTitle">YOU WIN!</div>
    <div class="m-prize" id="mPrize"></div>

    <div class="code-wrap" id="codeWrap">
      <div class="code-label">📩 Send this code to our DM to claim:</div>
      <div class="code-box" id="codeBox"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">📋 Copy Code</button>

</div>

<script>
const segments = [
  { label:"$10K+MacBook💻",  color:"#005f8a", emoji:"💻", code:"WIN-10K-MBP-4471", msg:"🎉 You won $10,000 CASH + MacBook Pro + USA Political Party Cap! DM the code below to claim!" },
  { label:"Better Luck😔",   color:"#1a0a2e", emoji:"😔", code:null, msg:"Aww, not this time! Come back tomorrow for another spin 💪" },
  { label:"Better Luck😔",   color:"#2D0057", emoji:"😔", code:null, msg:"So close! Come back tomorrow and try again 🤞" },
  { label:"$15K+MacBook👑",  color:"#7a5800", emoji:"👑", code:"WIN-15K-MBP-8823", msg:"🏆 MEGA WIN! $15,000 CASH + MacBook Pro + USA Political Party Cap! DM code NOW! 🚀" },
  { label:"Better Luck😔",   color:"#0d0d2e", emoji:"😔", code:null, msg:"Not your day! Come back tomorrow for a fresh spin 😊" },
  { label:"Better Luck😔",   color:"#1a0a2e", emoji:"😔", code:null, msg:"Aww! Try again tomorrow — big prizes are waiting! 🎯" },
  { label:"$20,000 CASH💰",  color:"#6b0000", emoji:"💰", code:"WIN-20K-CSH-9901", msg:"💰 JACKPOT! $20,000 CASH is YOURS! DM the code below IMMEDIATELY! 🔥🔥🔥" },
  { label:"Better Luck😔",   color:"#2D0057", emoji:"😔", code:null, msg:"Better luck tomorrow! Spin again for a chance to win big 🔥" },
  { label:"$5K+MacBook🎯",   color:"#5a1f99", emoji:"🎯", code:"WIN-5K-MBP-6612",  msg:"🎯 $5,000 CASH + MacBook Pro + USA Political Party Cap! DM code to claim! 💸" },
  { label:"Better Luck😔",   color:"#111133", emoji:"😔", code:null, msg:"Almost! Come back tomorrow for your next free spin 🌟" },
  { label:"Better Luck😔",   color:"#0d1a0d", emoji:"😔", code:null, msg:"Not this time! Tomorrow is a new chance to win big 💫" },
  { label:"iPhone 16 Pro📱", color:"#1a1a2e", emoji:"📱", code:"WIN-IP16-PRO-3356", msg:"📱 You won a Brand New iPhone 16 Pro Max + $200 CASH! DM the code below to claim! 🎊" },
  { label:"Better Luck😔",   color:"#2D0057", emoji:"😔", code:null, msg:"Aww so close! Don't give up — spin again tomorrow 🎰" },
  { label:"$10K+MacBook💻",  color:"#004d2b", emoji:"💻", code:"WIN-10K-MBP-5538", msg:"🎉 $10,000 CASH + MacBook Pro + USA Political Party Cap is YOURS! DM code NOW! 🔥" },
  { label:"Better Luck😔",   color:"#1a0a2e", emoji:"😔", code:null, msg:"Not today! Come back tomorrow for another shot at the big prizes 🏆" },
  { label:"Better Luck😔",   color:"#0d0d2e", emoji:"😔", code:null, msg:"So close yet so far! Try again tomorrow 😄" },
];

const MAX=1, KEY='sw4';
let deg=0, going=false, left=MAX, hist=[];

function load(){
  try{
    const d=new Date().toDateString(), s=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(s.date===d){left=s.left??MAX;hist=s.hist??[];}
    else{left=MAX;hist=[];}
  }catch(e){left=MAX;hist=[];}
  ui();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({date:new Date().toDateString(),left,hist}));}catch(e){}
}

const cv=document.getElementById('wheel');
const cx=cv.getContext('2d');
const N=segments.length, ARC=2*Math.PI/N;

function resize(){
  const s=Math.min(330,window.innerWidth*0.86);
  cv.width=s; cv.height=s; draw(deg);
}

function draw(r){
  const w=cv.width, h=cv.height, ox=w/2, oy=h/2, rad=ox-4;
  cx.clearRect(0,0,w,h);
  for(let i=0;i<N;i++){
    const s=r+i*ARC-Math.PI/2, e=s+ARC;
    cx.beginPath(); cx.moveTo(ox,oy); cx.arc(ox,oy,rad,s,e); cx.closePath();
    cx.fillStyle=segments[i].color; cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.2)'; cx.lineWidth=1.5; cx.stroke();
    cx.save(); cx.translate(ox,oy); cx.rotate(s+ARC/2); cx.textAlign='right';
    cx.fillStyle='#fff';
    const fs=w>280?11:9.5;
    cx.font=`700 ${fs}px Nunito,sans-serif`;
    cx.shadowColor='rgba(0,0,0,0.8)'; cx.shadowBlur=4;
    cx.fillText(segments[i].label, rad-10, 4);
    cx.restore();
  }
  cx.beginPath(); cx.arc(ox,oy,28,0,2*Math.PI);
  cx.fillStyle='rgba(0,0,0,0.55)'; cx.fill();
}

function spin(){
  if(going||left<=0)return;
  going=true; left--;
  document.getElementById('spinBtn').disabled=true;

  const extra=5+Math.floor(Math.random()*5);
  const tgt=Math.random()*2*Math.PI;
  const total=extra*2*Math.PI+tgt;
  const dur=4200+Math.random()*1200;
  const t0=performance.now(), a0=deg;
  const ease=t=>1-Math.pow(1-t,4);

  requestAnimationFrame(function f(now){
    const p=Math.min((now-t0)/dur,1);
    deg=a0+total*ease(p);
    draw(deg);
    if(p<1){requestAnimationFrame(f);return;}
    going=false;
    deg=deg%(2*Math.PI);
    const norm=(2*Math.PI-deg+2*Math.PI)%(2*Math.PI);
    const idx=Math.floor(norm/ARC)%N;
    const win=segments[idx];
    hist.unshift(win.emoji+' '+win.label.replace(/[^\w\s$+]/g,'').trim().slice(0,12));
    if(hist.length>5)hist.pop();
    save(); ui();
    setTimeout(()=>showModal(win),350);
  });
}

function showModal(w){
  document.getElementById('mEmoji').textContent=w.emoji;
  const loss=!w.code;
  document.getElementById('mTitle').textContent=loss?'SPIN AGAIN!':'🎉 YOU WIN!';
  document.getElementById('mPrize').textContent=w.label;
  document.getElementById('mMsg').textContent=w.msg;
  const cw=document.getElementById('codeWrap');
  if(w.code){
    document.getElementById('codeBox').textContent=w.code;
    cw.style.display='flex';
  } else { cw.style.display='none'; }
  document.getElementById('overlay').classList.add('show');
  if(!loss)boom();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('spinBtn').disabled=left<=0;
}

function copyCode(){
  const code=document.getElementById('codeBox').textContent;
  const btn=document.getElementById('copyBtn');
  const done=()=>{btn.textContent='✅ Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='📋 Copy Code';btn.classList.remove('ok');},2000);};
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(done).catch(()=>{fb(code);done();});}
  else{fb(code);done();}
}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}

function ui(){
  document.getElementById('spinsLeft').textContent=left;
  const b=document.getElementById('spinBtn');
  b.disabled=left<=0||going;
  b.textContent=left<=0?'⏰ Come Back Tomorrow!':'🎯 SPIN NOW!';
  document.getElementById('history').innerHTML=hist.map(h=>`<div class="history-item">${h}</div>`).join('');
}

function boom(){
  const cols=['#FFD700','#FF6B35','#FF3CAC','#7B2FBE','#00CFFF','#FF4444','#ADFF2F'];
  for(let i=0;i<75;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const c=cols[Math.floor(Math.random()*cols.length)];
    el.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*10}px;height:${8+Math.random()*12}px;background:${c};--d:${1.8+Math.random()*2}s;--dl:${Math.random()*0.5}s;--x:${(Math.random()-.5)*220}px;--r:${(Math.random()-.5)*720}deg;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4500);
  }
}

window.addEventListener('resize',resize);
resize(); load();
</script>

</body>
